# Release pipeline: pushing a vX.Y.Z tag builds an Apple Silicon binary,
# publishes it as a GitHub release asset, and updates the formula in
# iman1704/homebrew-tap. The legacy Go cask with the same name is removed
# because Homebrew cannot have a formula and a cask share a token.
#
# Required repository secret:
#   TAP_GITHUB_TOKEN - fine-grained PAT with Contents: Read and write on
#                      iman1704/homebrew-tap.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Validate release tag
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must match vX.Y.Z (got '$TAG')."
            exit 1
          fi

          version="${TAG#v}"
          manifest_version="$(
            cargo metadata --no-deps --format-version 1 --offline \
              | jq -r '.packages[] | select(.name == "siapv2") | .version'
          )"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "::error::Tag '$TAG' does not match the Cargo.toml version '$manifest_version'. Bump Cargo.toml and Cargo.lock before tagging."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Build arm64 binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Sign and package
        id: package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          asset="siap-v${VERSION}-macos-arm64.tar.gz"
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/siapv2 dist/siap
          chmod +x dist/siap

          # arm64 macOS refuses to execute binaries with no code signature.
          # Ad-hoc signing satisfies that requirement without an Apple identity.
          xattr -cr dist/siap
          codesign --force --sign - --timestamp=none dist/siap
          codesign --verify --strict --verbose=2 dist/siap

          # Avoid AppleDouble (._*) entries in the release archive.
          COPYFILE_DISABLE=1 tar -czf "dist/${asset}" -C dist siap

          sha256="$(shasum -a 256 "dist/${asset}" | awk '{print $1}')"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/$ASSET" \
              --title "v${VERSION}" \
              --generate-notes
          fi

  update-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check tap token
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [[ -z "$TAP_GITHUB_TOKEN" ]]; then
            echo "::error::Missing TAP_GITHUB_TOKEN. Add a fine-grained PAT with Contents: Read and write on iman1704/homebrew-tap."
            exit 1
          fi

      - name: Check out tap
        uses: actions/checkout@v4
        with:
          repository: iman1704/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Write formula
        working-directory: tap
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p Formula

          cat > Formula/siap.rb <<EOF
          class Siap < Formula
            desc "Opinionated Taskwarrior TUI"
            homepage "https://github.com/${REPO}"
            url "https://github.com/${REPO}/releases/download/v${VERSION}/siap-v${VERSION}-macos-arm64.tar.gz"
            version "${VERSION}"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "task"
            depends_on :macos
            depends_on arch: :arm64

            def install
              # Clear quarantine/provenance xattrs and re-apply an ad-hoc
              # signature so Gatekeeper and the arm64 kernel accept the binary.
              chmod 0755, "siap"
              quiet_system "/usr/bin/xattr", "-cr", "siap"
              system "/usr/bin/codesign", "--force", "--sign", "-", "siap"

              bin.install "siap"
            end

            def caveats
              <<~EOS
                siap is ad-hoc signed, not notarized. The install clears the
                quarantine attribute; if macOS still blocks it, run:
                  xattr -d com.apple.quarantine "#{bin}/siap"
              EOS
            end

            test do
              assert_match "siap", shell_output("#{bin}/siap --help")
            end
          end
          EOF

          if command -v ruby >/dev/null 2>&1; then
            ruby -c Formula/siap.rb
          fi

          # Homebrew cannot have a formula and a cask with the same token.
          # The old Go build's cask is replaced by this formula.
          if [[ -f Casks/siap.rb ]]; then
            git rm -f Casks/siap.rb
          fi

      - name: Commit and push formula
        working-directory: tap
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/siap.rb

          if git diff --cached --quiet; then
            echo "Formula is already up to date."
            exit 0
          fi

          git commit -m "siap ${VERSION}"
          git push
